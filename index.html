<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1621" />
  <title>Aura</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1621;
      --header: #17212b;
      --bubble: #182533;
      --text: #e4eaf0;
      --hint: #6d7f8f;
      --link: #6ab3f3;
      --btn: #2b3948;
      --primary: #3390ec;
      --success: #31b545;
      --steel: #8ea0b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 32rem;
      margin: 0 auto;
    }
    header { padding: 14px 16px 8px; }
    .kicker {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--steel);
    }
    h1 { margin: 6px 0 0; font-size: 26px; font-weight: 650; letter-spacing: -0.03em; }
    .lead { margin: 6px 0 0; color: var(--hint); font-size: 14px; line-height: 1.45; }
    main { flex: 1; overflow: auto; padding: 8px 16px 12px; }
    nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: var(--header);
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--hint);
      min-height: 52px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
    }
    nav button[aria-current="page"] { color: var(--link); }
    .card, .row {
      width: 100%;
      text-align: left;
      border: 0;
      color: inherit;
      font: inherit;
    }
    .card {
      display: block;
      background: var(--bubble);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
    }
    .card h2 { margin: 0; font-size: 16px; }
    .card p, .muted { color: var(--hint); font-size: 14px; line-height: 1.45; }
    .price { margin: 12px 0 0; color: var(--link); font-size: 14px; font-weight: 600; }
    .badge {
      float: right;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
    }
    .action, .ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      margin-top: 10px;
    }
    .action { background: var(--success); color: #fff; }
    .action.blue { background: var(--primary); }
    .ghost { background: var(--btn); color: var(--text); }
    .back {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--link);
      font: inherit;
      font-size: 14px;
      padding: 0 0 8px;
    }
    textarea {
      width: 100%;
      min-height: 128px;
      resize: none;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--header);
      color: var(--text);
      padding: 12px;
      font: inherit;
      font-size: 14px;
    }
    .lang {
      float: right;
      margin-top: 2px;
      border: 0;
      border-radius: 999px;
      background: var(--btn);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      min-height: 32px;
      padding: 0 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    /*
      Единственный файл Mini App. Каталог бот передаёт сам, в ссылке кнопки «Приложение».
      Демо-тарифов здесь нет. Залейте файл на HTTPS:
      WEBAPP_URL=https://ваш-домен/webapp/index.html
      Перезапустите бота и нажмите /start.
    */
    let CATALOG = { categories: [], products: [], payment_methods: [] };

    function decodeCatalogToken(token) {
      try {
        let b64 = String(token).replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const data = JSON.parse(new TextDecoder().decode(bytes));
        if (!data || !Array.isArray(data.products)) return null;
        return data;
      } catch (err) {
        return null;
      }
    }

    function catalogFromLocation() {
      const hash = location.hash || "";
      const idx = hash.indexOf("d=");
      if (idx === -1) return null;
      return decodeCatalogToken(decodeURIComponent(hash.slice(idx + 2).split("&")[0]));
    }

    const initialCatalog = catalogFromLocation();
    if (initialCatalog) CATALOG = initialCatalog;

    const T = {
      ru: {
        shop: "Тарифы",
        lead: "Каталог и оплата. Меню в чате остаётся.",
        sub: "Ваши подписки",
        chat: "Поддержка",
        tabShop: "Магазин",
        tabSub: "Подписка",
        tabChat: "Чат",
        hit: "Хит",
        days: "дней",
        price: "Цена",
        duration: "Срок",
        access: "Доступ после оплаты",
        pay: "Оплатить",
        back: "Назад",
        payWith: "Чем оплатить",
        stars: "Telegram Stars",
        xrocket: "xRocket",
        crypto: "CryptoBot",
        manual: "Перевод",
        invoice: "Счёт в чате",
        invoiceHint: "Бот пришлёт счёт в чат. Если окно не закрылось — откройте приложение кнопкой «Приложение» в меню, не кнопкой App у поля ввода.",
        none: "Активной подписки нет. Выберите тариф в магазине.",
        catalog: "К каталогу",
        fb: "Напишите одним сообщением — бот перешлёт его администратору.",
        send: "Отправить",
        sent: "Отправлено. Ответ придёт в чат с ботом.",
        empty: "В боте пока нет тарифов. Добавьте их в админке и снова нажмите /start.",
        openSub: "Открыть в чате",
        subLead: "Список подписок бот пришлёт в чат.",
        outside: "Откройте это окно кнопкой «Приложение» в боте.",
      },
      en: {
        shop: "Plans",
        lead: "Catalog and checkout. The chat menu stays.",
        sub: "Your subscriptions",
        chat: "Support",
        tabShop: "Shop",
        tabSub: "Plan",
        tabChat: "Chat",
        hit: "Top",
        days: "days",
        price: "Price",
        duration: "Duration",
        access: "Access after payment",
        pay: "Pay",
        back: "Back",
        payWith: "Pay with",
        stars: "Telegram Stars",
        xrocket: "xRocket",
        crypto: "CryptoBot",
        manual: "Transfer",
        invoice: "Invoice in chat",
        invoiceHint: "The bot will send an invoice in the chat. If this window stays open, launch it from the App button in the menu, not the button next to the input.",
        none: "No active plan. Pick one in the shop.",
        catalog: "Open catalog",
        fb: "Send one message — the bot forwards it to admin.",
        send: "Send",
        sent: "Sent. The reply will arrive in the bot chat.",
        empty: "No plans in the bot yet. Add them in admin and tap /start again.",
        openSub: "Open in chat",
        subLead: "The bot will send your subscriptions in the chat.",
        outside: "Open this page from the App button inside the bot.",
      },
    };

    let tw = window.Telegram && window.Telegram.WebApp;
    function bindTelegram() {
      tw = window.Telegram && window.Telegram.WebApp;
      if (!tw) return;
      try {
        tw.ready();
        tw.expand();
        const userCode = tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code;
        if (userCode) lang = userCode.toLowerCase().startsWith("en") ? "en" : "ru";
      } catch (err) {
        /* outside Telegram */
      }
      render();
    }
    const tgScript = document.createElement("script");
    tgScript.src = "https://telegram.org/js/telegram-web-app.js";
    tgScript.onload = bindTelegram;
    document.head.appendChild(tgScript);

    const code = (tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || navigator.language || "ru";
    let lang = code.toLowerCase().startsWith("en") ? "en" : "ru";
    let tab = "shop";
    let screen = { name: "list" };
    let note = "";
    let sent = false;

    function tx(key) { return T[lang][key]; }

    function send(payload) {
      if (!tw || typeof tw.sendData !== "function") return false;
      try {
        tw.sendData(JSON.stringify(payload));
        tw.close();
        return true;
      } catch (err) {
        return false;
      }
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "\u0026amp;")
        .replace(/</g, "\u003c")
        .replace(/>/g, "\u003e")
        .replace(/"/g, "\u0026quot;");
    }

    function render() {
      const t = T[lang];
      const product = CATALOG.products.find((p) => p.id === screen.id) || null;
      let title = t.shop;
      if (tab === "sub") title = t.sub;
      else if (tab === "chat") title = t.chat;
      else if (screen.name === "cat") {
        const cat = CATALOG.categories.find((c) => c.id === screen.id);
        title = cat ? cat.title : t.shop;
      } else if (product && screen.name !== "list") title = product.title;

      let body = "";
      if (tab === "shop") body = shop(product);
      else if (tab === "sub") body = sub();
      else body = chat();

      document.getElementById("app").innerHTML =
        '<header>' +
          '<button class="lang" id="lang">' + (lang === "ru" ? "EN" : "RU") + "</button>" +
          '<p class="kicker">Aura</p>' +
          "<h1>" + esc(title) + "</h1>" +
          (tab === "shop" && screen.name === "list" ? '<p class="lead">' + esc(t.lead) + "</p>" : "") +
        "</header>" +
        "<main>" + body + (!(tw && tw.initData) ? '<p class="muted">' + esc(t.outside) + "</p>" : "") + "</main>" +
        "<nav>" +
          tabBtn("shop", t.tabShop) +
          tabBtn("sub", t.tabSub) +
          tabBtn("chat", t.tabChat) +
        "</nav>";

      document.getElementById("lang").onclick = () => { lang = lang === "ru" ? "en" : "ru"; render(); };
      document.querySelectorAll("[data-tab]").forEach((el) => {
        el.onclick = () => { tab = el.getAttribute("data-tab"); if (screen.name === "done") screen = { name: "list" }; render(); };
      });
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.onclick = () => {
          const go = el.getAttribute("data-go");
          if (go === "list") screen = { name: "list" };
          else if (go === "shop-tab") tab = "shop";
          else if (go === "mysub") { send({ action: "mysub" }); return; }
          else if (go.startsWith("cat:")) screen = { name: "cat", id: Number(go.slice(4)) };
          else if (go.startsWith("product:")) screen = { name: "product", id: Number(go.slice(8)) };
          else if (go.startsWith("pay:")) {
            const item = CATALOG.products.find((p) => p.id === Number(go.slice(4)));
            if (CATALOG.payment_methods && CATALOG.payment_methods.length > 0) {
              screen = { name: "pay_methods", id: item.id };
            } else {
              if (item && send({ action: "pay", product_id: item.id, title: item.title })) return;
              screen = { name: "invoice", id: item ? item.id : screen.id };
            }
          }
          else if (go.startsWith("pay_method:")) {
            const parts = go.split(":");
            send({ action: "pay_method", product_id: Number(parts[1]), method_id: Number(parts[2]) });
            return;
          }
          render();
        };
      });
      const area = document.getElementById("note");
      if (area) {
        area.value = note;
        area.oninput = () => { note = area.value; };
      }
      const sendBtn = document.getElementById("send");
      if (sendBtn) {
        sendBtn.onclick = () => {
          if (!note.trim()) return;
          if (send({ action: "support", text: note.trim() })) return;
          sent = true;
          render();
        };
      }
    }

    function tabBtn(id, label) {
      return '<button type="button" data-tab="' + id + '"' + (tab === id ? ' aria-current="page"' : "") + ">" + esc(label) + "</button>";
    }

    function shop(product) {
      const t = T[lang];
      if (!CATALOG.products.length && screen.name === "list") {
        return '<p class="muted">' + esc(t.empty) + "</p>";
      }
      if (screen.name === "invoice" && product) {
        return '<button class="back" data-go="product:' + product.id + '">' + esc(t.back) + "</button>" +
          '<div class="card"><h2>' + esc(t.invoice) + "</h2><p>" + esc(product.title) + " · " + esc(product.price) + "</p><p>" + esc(t.invoiceHint) + "</p></div>";
      }

      if (screen.name === "pay_methods" && product) {
        let html = '<button class="back" data-go="product:' + product.id + '">' + esc(t.back) + "</button>";
        html += '<div class="card"><h2>' + esc(t.payWith) + "</h2><p>" + esc(product.title) + " · " + esc(product.price) + "</p></div>";

        CATALOG.payment_methods.forEach(pm => {
          let icon = "💳";
          if (pm.ptype === "crypto" || pm.ptype === "cryptobot") icon = "🪙";
          if (pm.ptype === "xrocket" || pm.ptype === "rocket") icon = "🚀";
          if (pm.ptype === "stars") icon = "⭐️";
          if (pm.ptype === "manual") icon = "🧾";

          html += '<button class="card action ghost" style="justify-content:flex-start; padding-left:16px; margin-bottom:8px;" data-go="pay_method:' + product.id + ':' + pm.id + '">' + icon + ' ' + esc(pm.name) + '</button>';
        });
        return html;
      }

      if (screen.name === "product" && product) {
        const back = CATALOG.categories.length > 1 ? "cat:" + product.category_id : "list";
        const channels = (product.channels || []).map((c) => '<div class="card"><h2>' + esc(c) + "</h2></div>").join("");
        return '<button class="back" data-go="' + back + '">' + esc(t.back) + "</button>" +
          (product.description ? '<p class="muted">' + esc(product.description) + "</p>" : "") +
          '<div class="card"><p>' + esc(t.price) + ": <b style=\"color:var(--text)\">" + esc(product.price) + "</b></p><p>" + esc(t.duration) + ": " + product.days + " " + esc(t.days) + "</p></div>" +
          (channels ? '<p class="kicker">' + esc(t.access) + "</p>" + channels : "") +
          '<button class="action" data-go="pay:' + product.id + '">' + esc(t.pay) + "</button>";
      }
      if (screen.name === "list" && CATALOG.categories.length > 1) {
        return CATALOG.categories.map((c) =>
          '<button class="card" data-go="cat:' + c.id + '"><h2>' + esc(c.title) + "</h2>" +
          (c.description ? "<p>" + esc(c.description) + "</p>" : "") + "</button>"
        ).join("");
      }
      const list = screen.name === "cat"
        ? CATALOG.products.filter((p) => p.category_id === screen.id)
        : CATALOG.products;
      const back = screen.name === "cat" && CATALOG.categories.length > 1
        ? '<button class="back" data-go="list">' + esc(t.back) + "</button>"
        : "";
      if (!list.length) return back + '<p class="muted">' + esc(t.empty) + "</p>";
      return back + list.map((p) =>
        '<button class="card" data-go="product:' + p.id + '">' +
          "<h2>" + esc(p.title) + "</h2>" +
          (p.description ? "<p>" + esc(p.description) + "</p>" : "") +
          '<p class="price">' + esc(p.price) + " · " + p.days + " " + esc(t.days) + "</p></button>"
      ).join("");
    }

    function sub() {
      const t = T[lang];
      return '<p class="muted">' + esc(t.subLead) + '</p><button class="action blue" data-go="mysub">' + esc(t.openSub) + "</button>";
    }

    function chat() {
      const t = T[lang];
      if (sent) return '<p class="muted">' + esc(t.sent) + "</p>";
      return '<p class="muted">' + esc(t.fb) + "</p>" +
        '<textarea id="note" placeholder=""></textarea>' +
        '<button class="action blue" id="send">' + esc(t.send) + "</button>";
    }

    render();
  </script>
</body>
</html>
