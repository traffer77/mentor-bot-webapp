<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1621" />
  <title>Aura</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1621;
      --header: #17212b;
      --bubble: #182533;
      --text: #e4eaf0;
      --hint: #6d7f8f;
      --link: #6ab3f3;
      --btn: #2b3948;
      --primary: #3390ec;
      --success: #31b545;
      --steel: #8ea0b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 32rem;
      margin: 0 auto;
    }
    header { padding: 14px 16px 8px; }
    .kicker {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--steel);
    }
    h1 { margin: 6px 0 0; font-size: 26px; font-weight: 650; letter-spacing: -0.03em; }
    .lead { margin: 6px 0 0; color: var(--hint); font-size: 14px; line-height: 1.45; }
    main { flex: 1; overflow: auto; padding: 8px 16px 12px; }
    nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: var(--header);
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--hint);
      min-height: 52px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
    }
    nav button[aria-current="page"] { color: var(--link); }
    .card, .row {
      width: 100%;
      text-align: left;
      border: 0;
      color: inherit;
      font: inherit;
    }
    .card {
      display: block;
      background: var(--bubble);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
    }
    .card h2 { margin: 0; font-size: 16px; }
    .card p, .muted { color: var(--hint); font-size: 14px; line-height: 1.45; }
    .price { margin: 12px 0 0; color: var(--link); font-size: 14px; font-weight: 600; }
    .badge {
      float: right;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
    }
    .action, .ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      margin-top: 10px;
    }
    .action { background: var(--success); color: #fff; }
    .action.blue { background: var(--primary); }
    .ghost { background: var(--btn); color: var(--text); }
    .back {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--link);
      font: inherit;
      font-size: 14px;
      padding: 0 0 8px;
    }
    textarea {
      width: 100%;
      min-height: 128px;
      resize: none;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--header);
      color: var(--text);
      padding: 12px;
      font: inherit;
      font-size: 14px;
    }
    .lang {
      float: right;
      margin-top: 2px;
      border: 0;
      border-radius: 999px;
      background: var(--btn);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      min-height: 32px;
      padding: 0 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    /*
      Единственный файл Mini App. Залейте его на HTTPS и в .env бота:
      WEBAPP_URL=https://ваш-домен/webapp/index.html
      Перезапустите бота и нажмите /start — появится кнопка «Приложение».

      id тарифа — число из админки бота. title должен совпадать с названием товара,
      если id не совпадёт: бот ищет тариф по названию.
    */
    const PRODUCTS = [
      {
        id: 1,
        title: { ru: "Базовый", en: "Starter" },
        desc: {
          ru: "Доступ ко всем закрытым каналам на 30 дней. Ссылки с защитой от пересылки.",
          en: "Access to all private channels for 30 days. Forward-protected invite links.",
        },
        price: "9.99 USD",
        days: 30,
        channels: ["VIP Club", "Signals"],
      },
      {
        id: 2,
        title: { ru: "Про", en: "Pro" },
        desc: {
          ru: "Всё из Базового + приоритетная поддержка и закрытый чат.",
          en: "Everything in Starter plus priority support and a private chat.",
        },
        price: "24.90 USD",
        days: 90,
        channels: ["VIP Club", "Signals", "Pro Chat"],
      },
    ];

    const T = {
      ru: {
        shop: "Тарифы",
        lead: "Каталог и оплата. Меню в чате остаётся.",
        sub: "Ваши подписки",
        chat: "Поддержка",
        tabShop: "Магазин",
        tabSub: "Подписка",
        tabChat: "Чат",
        hit: "Хит",
        days: "дней",
        price: "Цена",
        duration: "Срок",
        access: "Доступ после оплаты",
        pay: "Оплатить",
        back: "Назад",
        payWith: "Чем оплатить",
        stars: "Telegram Stars",
        xrocket: "xRocket",
        crypto: "CryptoBot",
        manual: "Перевод",
        invoice: "Счёт в чате",
        invoiceHint: "Бот пришлёт счёт в чат. Если окно не закрылось — откройте приложение кнопкой «Приложение» в меню, не кнопкой App у поля ввода.",
        none: "Активной подписки нет. Выберите тариф в магазине.",
        catalog: "К каталогу",
        fb: "Напишите одним сообщением — бот перешлёт его администратору.",
        send: "Отправить",
        sent: "Отправлено. Ответ придёт в чат с ботом.",
        outside: "Это окно работает внутри Telegram. Откройте его кнопкой «Приложение» в боте.",
      },
      en: {
        shop: "Plans",
        lead: "Catalog and checkout. The chat menu stays.",
        sub: "Your subscriptions",
        chat: "Support",
        tabShop: "Shop",
        tabSub: "Plan",
        tabChat: "Chat",
        hit: "Top",
        days: "days",
        price: "Price",
        duration: "Duration",
        access: "Access after payment",
        pay: "Pay",
        back: "Back",
        payWith: "Pay with",
        stars: "Telegram Stars",
        xrocket: "xRocket",
        crypto: "CryptoBot",
        manual: "Transfer",
        invoice: "Invoice in chat",
        invoiceHint: "The bot will send an invoice in the chat. If this window stays open, launch it from the App button in the menu, not the button next to the input.",
        none: "No active plan. Pick one in the shop.",
        catalog: "Open catalog",
        fb: "Send one message — the bot forwards it to admin.",
        send: "Send",
        sent: "Sent. The reply will arrive in the bot chat.",
        outside: "Open this page from the App button inside the bot.",
      },
    };

    let tw = window.Telegram && window.Telegram.WebApp;
    function bindTelegram() {
      tw = window.Telegram && window.Telegram.WebApp;
      if (!tw) return;
      try {
        tw.ready();
        tw.expand();
        const userCode = tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code;
        if (userCode) lang = userCode.toLowerCase().startsWith("en") ? "en" : "ru";
      } catch (err) {
        /* outside Telegram */
      }
      render();
    }
    const tgScript = document.createElement("script");
    tgScript.src = "https://telegram.org/js/telegram-web-app.js";
    tgScript.onload = bindTelegram;
    document.head.appendChild(tgScript);

    const code = (tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || navigator.language || "ru";
    let lang = code.toLowerCase().startsWith("en") ? "en" : "ru";
    let tab = "shop";
    let screen = { name: "list" };
    let note = "";
    let sent = false;

    function tx(key) { return T[lang][key]; }

    function send(payload) {
      if (!tw || typeof tw.sendData !== "function") return false;
      try {
        tw.sendData(JSON.stringify(payload));
        tw.close();
        return true;
      } catch (err) {
        return false;
      }
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "\u0026amp;")
        .replace(/</g, "\u003c")
        .replace(/>/g, "\u003e")
        .replace(/"/g, "\u0026quot;");
    }

    function render() {
      const t = T[lang];
      const product = PRODUCTS.find((p) => p.id === screen.id) || null;
      let title = t.shop;
      if (tab === "sub") title = t.sub;
      else if (tab === "chat") title = t.chat;
      else if (product && screen.name !== "list") title = product.title[lang];

      let body = "";
      if (tab === "shop") body = shop(product);
      else if (tab === "sub") body = sub();
      else body = chat();

      document.getElementById("app").innerHTML =
        '<header>' +
          '<button class="lang" id="lang">' + (lang === "ru" ? "EN" : "RU") + "</button>" +
          '<p class="kicker">Aura</p>' +
          "<h1>" + esc(title) + "</h1>" +
          (tab === "shop" && screen.name === "list" ? '<p class="lead">' + esc(t.lead) + "</p>" : "") +
        "</header>" +
        "<main>" + body + (!(tw && tw.initData) ? '<p class="muted">' + esc(t.outside) + "</p>" : "") + "</main>" +
        "<nav>" +
          tabBtn("shop", t.tabShop) +
          tabBtn("sub", t.tabSub) +
          tabBtn("chat", t.tabChat) +
        "</nav>";

      document.getElementById("lang").onclick = () => { lang = lang === "ru" ? "en" : "ru"; render(); };
      document.querySelectorAll("[data-tab]").forEach((el) => {
        el.onclick = () => { tab = el.getAttribute("data-tab"); if (screen.name === "done") screen = { name: "list" }; render(); };
      });
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.onclick = () => {
          const go = el.getAttribute("data-go");
          if (go === "list") screen = { name: "list" };
          else if (go === "shop-tab") tab = "shop";
          else if (go.startsWith("product:")) screen = { name: "product", id: Number(go.slice(8)) };
          else if (go.startsWith("pay:")) screen = { name: "pay", id: Number(go.slice(4)) };
          else if (go.startsWith("method:")) {
            const method = go.slice(7);
            const item = PRODUCTS.find((p) => p.id === screen.id);
            if (item && send({ action: "pay", product_id: item.id, title: item.title[lang], method })) return;
            screen = { name: "invoice", id: item ? item.id : screen.id, method };
          }
          render();
        };
      });
      const area = document.getElementById("note");
      if (area) {
        area.value = note;
        area.oninput = () => { note = area.value; };
      }
      const sendBtn = document.getElementById("send");
      if (sendBtn) {
        sendBtn.onclick = () => {
          if (!note.trim()) return;
          if (send({ action: "support", text: note.trim() })) return;
          sent = true;
          render();
        };
      }
    }

    function tabBtn(id, label) {
      return '<button type="button" data-tab="' + id + '"' + (tab === id ? ' aria-current="page"' : "") + ">" + esc(label) + "</button>";
    }

    function shop(product) {
      const t = T[lang];
      if (screen.name === "invoice" && product) {
        return '<button class="back" data-go="pay:' + product.id + '">' + esc(t.back) + "</button>" +
          '<div class="card"><h2>' + esc(t.invoice) + "</h2><p>" + esc(product.title[lang]) + " · " + esc(product.price) + "</p><p>" + esc(t.invoiceHint) + "</p></div>";
      }
      if (screen.name === "pay" && product) {
        return '<button class="back" data-go="product:' + product.id + '">' + esc(t.back) + "</button>" +
          '<p class="muted">' + esc(t.payWith) + " · " + esc(product.price) + "</p>" +
          method("stars", t.stars, "blue") +
          method("xrocket", t.xrocket, "action") +
          method("crypto", t.crypto, "ghost") +
          method("manual", t.manual, "ghost");
      }
      if (screen.name === "product" && product) {
        const channels = product.channels.map((c) => '<div class="card"><h2>' + esc(c) + "</h2></div>").join("");
        return '<button class="back" data-go="list">' + esc(t.back) + "</button>" +
          '<p class="muted">' + esc(product.desc[lang]) + "</p>" +
          '<div class="card"><p>' + esc(t.price) + ": <b style=\"color:var(--text)\">" + esc(product.price) + "</b></p><p>" + esc(t.duration) + ": " + product.days + " " + esc(t.days) + "</p></div>" +
          '<p class="kicker">' + esc(t.access) + "</p>" + channels +
          '<button class="action" data-go="pay:' + product.id + '">' + esc(t.pay) + "</button>";
      }
      return PRODUCTS.map((p, i) =>
        '<button class="card" data-go="product:' + p.id + '">' +
          (i === 0 ? '<span class="badge">' + esc(t.hit) + "</span>" : "") +
          "<h2>" + esc(p.title[lang]) + "</h2><p>" + esc(p.desc[lang]) + "</p>" +
          '<p class="price">' + esc(p.price) + " · " + p.days + " " + esc(t.days) + "</p></button>"
      ).join("");
    }

    function method(id, label, kind) {
      const cls = kind === "blue" ? "action blue" : kind;
      return '<button class="' + cls + '" data-go="method:' + id + '">' + esc(label) + "</button>";
    }

    function sub() {
      const t = T[lang];
      return '<p class="muted">' + esc(t.none) + '</p><button class="action blue" data-go="shop-tab">' + esc(t.catalog) + "</button>";
    }

    function chat() {
      const t = T[lang];
      if (sent) return '<p class="muted">' + esc(t.sent) + "</p>";
      return '<p class="muted">' + esc(t.fb) + "</p>" +
        '<textarea id="note" placeholder=""></textarea>' +
        '<button class="action blue" id="send">' + esc(t.send) + "</button>";
    }

    render();
  </script>
</body>
</html>
